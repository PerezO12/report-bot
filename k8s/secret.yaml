# IMPORTANTE: Este archivo es una PLANTILLA. No subas valores reales al repo.
# Genera los valores base64 con:
#   echo -n "TU_VALOR" | base64
#
# O usa el script deploy.sh que lo hace automáticamente desde el .env
apiVersion: v1
kind: Secret
metadata:
  name: botdaily-secret
  namespace: botdaily
type: Opaque
data:
  BOT_TOKEN: REEMPLAZAR_CON_BASE64     # echo -n "123456:ABCdef..." | base64
  ADMIN_CHAT_ID: REEMPLAZAR_CON_BASE64 # echo -n "987654321" | base64
